name: Build, Push and Deploy Docker Image

on:
  push:
    branches:
      - main  
      
jobs:
  build-and-push: 
    runs-on: ubuntu-latest 
    steps:
      
      - name: Checkout code 
        uses: actions/checkout@v3 
      
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v2 

      - name: Log in to Docker Hub 
        uses: docker/login-action@v2 
        with:
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build and push Docker image 
        uses: docker/build-push-action@v3 
        with:
          context: .
          push: true 
          tags: ${{ secrets.DOCKER_USERNAME }}/fleet221-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push 
    steps:
      
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.5  
        with:
          host: ${{ secrets.SSH_HOST }} 
          username: ${{ secrets.SSH_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Installer docker compose V2 si pas présent
            if ! docker compose version &>/dev/null; then
              sudo apt-get update -y
              sudo apt-get install -y docker-compose-plugin
            fi

            cd ~/app

            # Pull la nouvelle image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fleet221-api:latest

            # Lancer le conteneur
            sudo docker compose up -d --no-deps --force-recreate api

            # Nettoyer les anciennes images
            sudo docker image prune -f

      - name: Health Check
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sleep 10
            STATUS=$(sudo docker inspect --format='{{.State.Status}}' fleet221-api 2>/dev/null)
            echo "Status: $STATUS"
            if [ "$STATUS" != "running" ]; then
              echo "❌ Conteneur non démarré!"
              sudo docker logs fleet221-api --tail=50
              exit 1
            fi
            echo "✅ Conteneur opérationnel!"

  notify:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy]
    if: always()
    steps:

      - name: Notify Success
        if: needs.deploy.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Déploiement RÉUSSI!
            📦 Repo: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Par: ${{ github.actor }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Notify Failure
        if: needs.deploy.result == 'failure'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Déploiement ÉCHOUÉ!
            📦 Repo: ${{ github.repository }}
            🌿 Branch: ${{ github.ref_name }}
            👤 Par: ${{ github.actor }}
            🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}