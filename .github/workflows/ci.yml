#nom du workflow
name: Build and Push Docker Image

# Déclenchement du workflow
on:
  push:
    branches:
      - main  
      
# Définition des jobs c'est à dire les étapes à exécuter
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code # Récupère le code source du dépôt
        uses: actions/checkout@v3 # Utilise la version 3 de l'action checkout

      - name: Set up Docker Buildx # Configure Docker Buildx pour construire des images multi-plateformes
        uses: docker/setup-buildx-action@v2 # Utilise la version 2 de l'action setup-buildx

      - name: Log in to Docker Hub # Se connecte à Docker Hub pour pouvoir pousser l'image
        uses: docker/login-action@v2 # Utilise la version 2 de l'action login
        with:
          username: ${{ secrets.DOCKER_USERNAME }} # Utilise une variable d'environnement secrète pour le nom d'utilisateur Docker
          password: ${{ secrets.DOCKER_PASSWORD }} # Utilise une variable d'environnement secrète pour le mot de passe Docker


      - name: Build and push Docker image # Construit l'image Docker et la pousse sur Docker Hub
        uses: docker/build-push-action@v3 # Utilise la version 3 de l'action build-push
        with:
          context: . # Contexte de construction, c'est-à-dire le dossier où se trouve le Dockerfile
          push: true # Indique que l'image doit être poussée après la construction
          tags: ${{ secrets.DOCKER_USERNAME }}/fleet221-api:${{ github.ref == 'refs/heads/main' && 'latest' || github.ref_name }} # Tag de l'image, utilise "latest" pour la branche main et le nom de la branche pour les autres
          build-args: | # Arguments de construction, notamment pour passer le mot de passe de la base de données
            DB_PASSWORD=${{ secrets.DB_PASSWORD }} # Utilise une variable d'environnement secrète pour le mot de passe de la base de données


    
