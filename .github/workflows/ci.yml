name: Build, Push and Deploy Docker Image

on:
  push:
    branches:
      - main  
      
jobs:
  build-and-push: 
    runs-on: ubuntu-latest 
    steps:
      
      - name: Checkout code 
        uses: actions/checkout@v3 
      
      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v2 

      - name: Log in to Docker Hub 
        uses: docker/login-action@v2 
        with:
          username: ${{ secrets.DOCKER_USERNAME }} 
          password: ${{ secrets.DOCKER_PASSWORD }} 

      - name: Build and push Docker image 
        uses: docker/build-push-action@v3 
        with:
          context: .
          push: true 
          tags: ${{ secrets.DOCKER_USERNAME }}/fleet221-api:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push 
    steps:
      
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v0.1.5  
        with:
          host: ${{ secrets.SSH_HOST }} 
          username: ${{ secrets.SSH_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3000
          script: |
            cd ~/app

            # Pull la nouvelle image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/fleet221-api:latest

            # Lancer le conteneur
            sudo docker compose up -d --no-deps --force-recreate api

            # Nettoyer les anciennes images
            sudo docker image prune -f

      - name: Health Check
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 3000
          script: |
            echo " Attente du démarrage du conteneur..."
            sleep 10

            # Vérifier que le conteneur tourne
            STATUS=$(sudo docker inspect --format='{{.State.Status}}' fleet221-api 2>/dev/null)
            HEALTH=$(sudo docker inspect --format='{{.State.Health.Status}}' fleet221-api 2>/dev/null)

            echo "Status: $STATUS"
            echo "Health: $HEALTH"

            if [ "$STATUS" != "running" ]; then
              echo "❌ Le conteneur n'est pas en cours d'exécution!"
              sudo docker logs fleet221-api --tail=50
              exit 1
            fi

            # Vérifier que l'API répond
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || echo "000")
            echo "HTTP Code: $HTTP_CODE"

            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ L'API ne répond pas (HTTP $HTTP_CODE)"
              exit 1
            fi

            echo "✅ Déploiement réussi! API opérationnelle."

